<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Hossam Social Media</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #075e54;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #e5ddd5;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .message.received {
            background: #ffffff;
            align-self: flex-start;
        }
        .message.sent {
            background: #dcf8c6;
            align-self: flex-end;
        }
        .message .sender {
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .chat-input button {
            background: #128c7e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input button:hover {
            background: #075e54;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        Mohamed Hossam Social Media
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
        <input type="text" id="username" placeholder="اسمك..." style="max-width: 90px;">
        <input type="text" id="messageInput" placeholder="اكتب رسالة...">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<!-- مكتبات Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKVunerGF2na7lc08PdOAtCk1CJ3NpS1A",
      authDomain: "mohamed-hossam-23d46.firebaseapp.com",
      databaseURL: "https://mohamed-hossam-23d46-default-rtdb.firebaseio.com",
      projectId: "mohamed-hossam-23d46",
      storageBucket: "mohamed-hossam-23d46.firebasestorage.app",
      messagingSenderId: "866959223803",
      appId: "1:866959223803:web:46d495dc2835608ac9f95e",
      measurementId: "G-M5C3Q20QR1"
    };

    // تهيئة Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const database = firebase.database();
    const messagesRef = database.ref('messages');

    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const usernameInput = document.getElementById('username');

    // إرسال الرسالة مع معالجة الأخطاء
    function sendMessage() {
        const text = messageInput.value.trim();
        const user = usernameInput.value.trim() || 'مجهول';

        if (text !== '') {
            messagesRef.push({
                username: user,
                message: text,
                timestamp: Date.now()
            }).then(() => {
                messageInput.value = '';
            }).catch((error) => {
                alert("خطأ في الإرسال: تأكد من تفعيل Rules في Firebase إلى true\n\n" + error.message);
            });
        }
    }

    // استقبال الرسائل
    messagesRef.on('child_added', (snapshot) => {
        const data = snapshot.val();
        const msgDiv = document.createElement('div');
        
        const currentUser = usernameInput.value.trim() || 'مجهول';
        const isMe = data.username === currentUser;

        msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
        msgDiv.innerHTML = `<div class="sender">${data.username}</div>${data.message}`;
        
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }, (error) => {
        console.error("خطأ قراءة البيانات:", error);
    });

    // إرسال بزر Enter
    messageInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
